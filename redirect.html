<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autorização recebida</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; line-height: 1.6; color: #222; }
  textarea { width: 100%; height: 120px; font-family: monospace; font-size: 13px; }
</style>
</head>
<body>
<h1>Autorização recebida</h1>
<p>Copie o endereço inteiro desta página (ou o conteúdo da caixa abaixo) e cole no comando <code>publicar_tiktok.py autorizar --code "..."</code>.</p>
<textarea id="u" readonly></textarea>
<p id="erro" style="color:#c0392b"></p>
<script>
  document.getElementById('u').value = location.href;
  var q = new URLSearchParams(location.search);
  if (q.get('error')) document.getElementById('erro').textContent = 'Erro: ' + q.get('error') + ' - ' + (q.get('error_description') || '');
</script>
</body>
</html>
